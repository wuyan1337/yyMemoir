[package]
name = "yymemoir"
version = "0.1.0"
description = "yyMemoir：VRChat 回顾工具"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yymemoir_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.2", features = ["tray-icon"] }
yymemoir-core = { path = "../../crates/core" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.36.1"
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23.1"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.7.3"
