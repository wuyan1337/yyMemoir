[package]
name = "yymemoir-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
chrono = "0.4.45"
serde_json = "1.0.154"


# HTTPS：Windows 用系统 TLS（schannel，跟随系统证书和代理）；其他平台用 rustls
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls", "gzip"] }
native-tls = "0.2.18"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
